services:
  - type: web
    name: medica-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bdmedical.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DELIVERY_EMAIL
        value: delivery@bdmedical.com
      - key: DELIVERY_PASSWORD
        value: delivery123
      - key: DB_PATH
        value: /var/data/medical.db
    disk:
      name: medica-db-disk
      mountPath: /var/data
      sizeGB: 1

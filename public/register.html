<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="register_title">Register - Medica</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span>🏥</span> Medica</a>
      <button class="hamburger" id="hamburger">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="medicines.html">Medicines</a></li>
        <li><a href="doctors.html">Doctors</a></li>
        <li><a href="diseases.html">Diseases</a></li>
        <li class="nav-dropdown"><a onclick="this.parentElement.classList.toggle('open')">Guidelines &#9662;</a>
          <div class="nav-dropdown-menu">
            <a href="guidelines.html?type=national">National</a>
            <a href="guidelines.html?type=international">International</a>
            <a href="guidelines.html">All Guidelines</a>
          </div>
        </li>
        <li><a href="investigations.html">Investigations</a></li>
        <li><a href="chatbot.html">AI Assistant</a></li>
        <li><a href="reminders.html">Reminders</a></li>
        <li id="admin-link" class="hidden"><a href="admin.html">Admin</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div id="auth-links">
          <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
          <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
        <div id="user-links" class="hidden" style="display:flex;align-items:center;gap:0.75rem;">
          <a href="dashboard.html" class="btn btn-secondary btn-sm"><span id="user-name"></span></a>
          <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="card auth-card">
      <h2 data-i18n="register_title">Create Account</h2>
      <p class="subtitle" data-i18n="register_subtitle">Join Medica platform today</p>
      <div id="alert-container"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="name" data-i18n="register_name">Full Name</label>
          <input type="text" id="name" data-i18n="register_name_placeholder" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="register_email">Email Address</label>
          <input type="email" id="email" data-i18n="register_email_placeholder" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="register_password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" data-i18n="register_password_placeholder" placeholder="Minimum 6 characters" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
              <span class="material-icons">visibility</span>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm-password" data-i18n="register_confirm">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" data-i18n="register_confirm_placeholder" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-password')">
              <span class="material-icons">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="register_create_btn">Create Account</button>
      </form>
      <p class="auth-footer"><span data-i18n="register_have_account">Already have an account?</span> <a href="login.html" data-i18n="register_login_here">Sign in</a></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = '/dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const container = document.getElementById('alert-container');

      if (password !== confirm) {
        showAlert(container, 'Passwords do not match.');
        return;
      }

      try {
        const data = await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });
        setAuth(data.token, data.user);
        window.location.href = '/medical-profile.html';
      } catch (err) {
        showAlert(container, err.message);
      }
    });
  </script>
  <script src="js/language-switcher.js"></script>
</body>
</html>

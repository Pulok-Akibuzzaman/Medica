<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">Login - Medica</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span>🏥</span> Medica</a>
      <button class="hamburger" id="hamburger">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="medicines.html">Medicines</a></li>
        <li><a href="doctors.html">Doctors</a></li>
        <li class="nav-dropdown"><a onclick="this.parentElement.classList.toggle('open')">More &#9662;</a>
          <div class="nav-dropdown-menu">
            <a href="diseases.html">Diseases</a>
            <a href="guidelines.html">Guidelines</a>
            <a href="investigations.html">Investigations</a>
          </div>
        </li>
        <li><a href="chatbot.html">AI Assistant</a></li>
        <li><a href="reminders.html">Reminders</a></li>
        <li><a href="appointments.html">Appointments</a></li>
        <li id="admin-link" class="hidden"><a href="admin.html">Admin</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div id="auth-links">
          <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
          <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
        <div id="user-links" class="hidden" style="display:flex;align-items:center;gap:0.75rem;">
          <a href="dashboard.html" class="btn btn-secondary btn-sm"><span id="user-name"></span></a>
          <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="card auth-card">
      <h2 data-i18n="login_header">Welcome Back</h2>
      <p class="subtitle" data-i18n="login_subtitle">Sign in to your account</p>
      <div id="alert-container"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email" data-i18n="login_email">Email Address</label>
          <input type="email" id="email" data-i18n="login_email_placeholder" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login_password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" data-i18n="login_password_placeholder" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
              <span class="material-icons">visibility</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login_signin_btn">Sign In</button>
      </form>
      <p class="auth-footer"><span data-i18n="login_no_account">Don't have an account?</span> <a href="register.html" data-i18n="login_register_here">Register here</a></p>
      <p class="auth-footer" style="margin-top:0.5rem;font-size:0.8rem;color:var(--text-light)" data-i18n="login_admin_notice">
        Admin: admin@bdmedical.com / admin123
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = '/dashboard.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const container = document.getElementById('alert-container');

      try {
        const data = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        setAuth(data.token, data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert(container, err.message);
      }
    });
  </script>
  <script src="js/language-switcher.js"></script>
</body>
</html>
